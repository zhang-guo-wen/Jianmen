name: Deploy Docs

on:
  push:
    branches: [main, dev]
    paths: ['docs-site/**', '.github/workflows/deploy-docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: 安装依赖
        run: npm ci
        working-directory: docs-site
      - name: 构建文档站
        run: npm run docs:build
        working-directory: docs-site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/src/.vitepress/dist
      - name: 部署到 Pages
        uses: actions/deploy-pages@v4
